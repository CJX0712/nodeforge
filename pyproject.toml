[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeforge"
version = "0.1.0"
description = "NodeForge: reproducible GNN node-classification benchmark with a validation-tuned multi-channel propagation model (AdaProp)"
authors = [{ name = "晨星" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
nodeforge = "nodeforge.cli:main"

[tool.setuptools.packages.find]
include = ["nodeforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E731",  # lambda assignments
    "E741",  # ambiguous names in math-heavy code
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
